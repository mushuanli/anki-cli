[package]
name = "anki-cli"
version = "0.1.0"
edition = "2021"
description = "Manifest-driven Anki packaging and legacy anki-helper project migration"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
genanki-rs = "0.4.0"
zip = "0.6"
bzip2 = { version = "0.4", features = ["static"] }
rusqlite = { version = "0.25.4", features = ["bundled"] }
tempfile = "3"
fs2 = "0.4"
zstd = "0.13"

